name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      JWT_ACCESS_SECRET: ci-access-secret-that-is-long-enough-000
      JWT_REFRESH_SECRET: ci-refresh-secret-that-is-long-enough-00
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.3
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @servicedesk/shared build
      - run: pnpm lint
      - run: pnpm -r typecheck
      - run: pnpm test
      - run: pnpm build
      # The committed seed must match the generator, so a schema change cannot
      # leave the demo dataset stale.
      - run: pnpm seed:build && git diff --exit-code apps/api/data/seed.json

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: servicedesk
          POSTGRES_PASSWORD: servicedesk
          POSTGRES_DB: servicedesk
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U servicedesk"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://servicedesk:servicedesk@localhost:5432/servicedesk?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: ci-access-secret-that-is-long-enough-000
      JWT_REFRESH_SECRET: ci-refresh-secret-that-is-long-enough-00
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.3
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @servicedesk/shared build
      - run: pnpm lint
      - run: pnpm -r typecheck
      - run: pnpm test
      - run: pnpm --filter @servicedesk/api db:deploy
      - run: pnpm build
